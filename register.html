<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Form</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background-color: #ffffff;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 500px;
        }

        h2 {
            text-align: center;
            margin-bottom: 20px;
            color: #333333;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            color: #555555;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 14px;
            transition: border-color 0.3s ease;
        }

        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            border-color: #007bff;
            outline: none;
        }

        .submit-btn {
            width: 100%;
            padding: 12px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        .submit-btn:hover {
            background-color: #0056b3;
        }

        @media (max-width: 480px) {
            .container {
                padding: 20px;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>নিবন্ধন ফরম (Registration Form)</h2>
        <form id="registrationForm" action="#" method="POST">
            
            <div class="form-group">
                <label for="fullName">পূর্ণ নাম (Full Name)</label>
                <input type="text" id="fullName" name="fullName" placeholder="আপনার নাম লিখুন" required>
            </div>

            <div class="form-group">
                <label for="email">ইমেইল ঠিকানা (Email Address)</label>
                <input type="email" id="email" name="email" placeholder="example@mail.com" required>
            </div>

            <div class="form-group">
                <label for="phone">মোবাইল নম্বর (Phone Number)</label>
                <input type="tel" id="phone" name="phone" placeholder="017XXXXXXXX" required>
            </div>

            <div class="form-group">
                <label for="gender">লিঙ্গ (Gender)</label>
                <select id="gender" name="gender" required>
                    <option value="" disabled selected>নির্বাচন করুন</option>
                    <option value="male">পুরুষ (Male)</option>
                    <option value="female">নারী (Female)</option>
                    <option value="other">অন্যান্য (Other)</option>
                </select>
            </div>

            <div class="form-group">
                <label for="address">ঠিকানা (Address)</label>
                <textarea id="address" name="address" rows="3" placeholder="আপনার বর্তমান ঠিকানা লিখুন"></textarea>
            </div>

            <button type="submit" class="submit-btn">জমা দিন (Submit)</button>
        </form>
    </div>

</body>
</html>
